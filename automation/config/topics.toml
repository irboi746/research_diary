# No year placeholder: a single standing page, which sources.py emits once
# rather than once per year.
[[sources]]
name = "[un]prompted"
retrieval = "urls"
window = "unseen"
check = "weekly"
url_templates = ["https://www.unprompted.au/schedule"]

# ---------------------------------------------------------------------------
# Tier 3. The compulsory sources are a floor, not a ceiling.
# ---------------------------------------------------------------------------

[discovery]
enabled = true
guidance = """
Search beyond the compulsory sources for work matching `interests`: security
research blogs, vendor and CERT advisories, protocol and implementation
documentation, IACR eprint, and regional conferences. Anything technical and
verifiable is in scope. NDSS, CCS and Oakland used to be listed here; they are
compulsory sources now, so discovery means looking past them.
"""

