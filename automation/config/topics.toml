# Reasons to drop an item outright, whatever its score. Jules rejects on these.
reject = [
  "withdrawn or superseded by a newer version already covered",
  "vendor marketing whitepaper whose conclusion is a product",
  "no technical detail beyond an abstract or press release",
  "already covered under a different URL or venue",
  "defence, detection or mitigation design with no new attack result",
  "benchmark or leaderboard score with no methodology or failure analysis",
  "a single site's or single app's finding with no generalisable class behind it",
  "posture scanning, configuration survey or compliance measurement with no demonstrated impact",
]

# How many items get a full write-up in a daily brief. The rest go to the
# overflow link roll — still recorded as seen, so they do not resurface. This is
# also the batch size queue.py hands out, so a conference backlog drains in runs
# of this many rather than arriving as one enormous post.
brief_max_summarized = 8

# Index pages of venues that are no longer compulsory sources.
#
# Must stay above the first [table] header, or TOML scopes it into that table.
#
# index_urls() is built from the url_templates above, so removing a source used
# to silently drop its index page out of the "never cite an index page for a
# specific work" blocklist. That blocklist exists because a published deep dive
# attached five invented talk titles to bare conference index URLs copied
# straight out of this file; it must only ever grow. Retiring a source is not a
# reason to start trusting its landing page as a citation.
retired_index_urls = [
  "https://offbyone.sg/",
]


# ---------------------------------------------------------------------------
# Compulsory sources. Every daily run must cover all of these.
# `retrieval` selects the tier: "api" (scripted query) or "urls" (enumerated
# pages that Jules reads itself).
# ---------------------------------------------------------------------------

[[sources]]
name = "arXiv"
# RSS, not the Atom API: export.arxiv.org rate-limits hard and answers a burst of
# queries with HTTP 429. rss.arxiv.org serves the same day's announcements as one
# cheap document per category, so a daily run makes one request per category.
# `retrieval = "api"` still works (arxiv.py --api) and is the only way to ask for
# a historical window, since a feed is only ever "today".
retrieval = "rss"
categories = ["cs.CR", "cs.AI", "cs.SE"]
feed_url = "https://rss.arxiv.org/rss/{category}"
window = "48h"
# Feed items carry an announce_type: new, cross, replace or replace-cross. The
# replace* pair is a new version of something already announced, which is the
# `reject` rule about superseded work, so only these two are considered.
announce_types = ["new", "cross"]

[[sources]]
name = "USENIX Security"
retrieval = "urls"
window = "unseen"
check = "weekly"
url_templates = [
  "https://www.usenix.org/conference/usenixsecurity{yy}/technical-sessions",
]

