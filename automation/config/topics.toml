#
# Research scope for the automated pipelines.
#
# TOML rather than YAML so the scripts can parse it with stdlib `tomllib`. The
# checkers that run on the merge path (pathguard, validate, postparse, linkcheck)
# stay stdlib-only for that reason; only the ingestion tools take dependencies,
# which the Jules VM installs once from requirements.txt and snapshots. See the
# "Jules console environment" section of README.md.
#
# Read by: automation/scripts/{arxiv,sources,validate,rank}.py
# Described to Jules by: AGENTS.md
#

# Drives relevance ranking and rejection. Be concrete — this is the real filter,
# far more than the source list is.
interests = [
  "memory-safety vulnerability classes and modern exploitation technique",
  "bypasses of deployed mitigations: CFI, ASLR, sandboxes, hypervisors, secure boot, pointer authentication",
  "fuzzing, symbolic execution, and automated vulnerability discovery",
  "reverse engineering, binary analysis, and decompilation tooling",
  "kernel, firmware, baseband, and embedded exploitation",
  "side-channel and microarchitectural attacks with a demonstrated primitive",
  "applied cryptography breaks in deployed protocols and implementations",
  "supply-chain attacks on package, build, and model-distribution ecosystems",
  "server-side web attacks: HTTP request smuggling and desync, parser and normalisation discrepancies between proxies, CDNs and origins, cache poisoning and cache deception, WebSocket upgrade smuggling and cross-site WebSocket hijacking, SSRF, deserialisation and template injection, authentication, session and SSO flaws",
  "web server, reverse-proxy and framework misconfiguration classes that yield server-side compromise — routing, path normalisation, header handling, inherited and default config — where the finding generalises across deployments rather than naming one site",
  "browser and client runtime exploitation: renderer and JIT bugs, same-origin and site-isolation bypass, extension and IPC attack surface; WebAssembly security in browsers and in standalone runtimes (wasmtime, WAMR, WASI) — runtime and JIT escape, memory-model bugs, and WASM used to carry or obfuscate payloads",
  "mobile: Android and iOS privilege escalation, sandbox and entitlement bypass, TEE and secure-enclave attacks, app and SDK reverse engineering",
  "cloud and multi-tenant infrastructure: container and hypervisor escape, IAM and federation flaw classes, metadata-service and workload-identity abuse, isolation failures between tenants",
  "LLMs and agents doing offensive work: vulnerability discovery, exploit and PoC generation, patch diffing, reverse engineering, fuzzing harness synthesis",
  "measured capability results for automated offence — CTF, CVE reproduction, pwn benchmarks — where the methodology and failure cases are reported, not just a score",
  "attacks on LLM-based systems and agents: prompt injection, tool and agent hijacking, sandbox escape from code interpreters, memory and RAG poisoning",
  "attacks on the ML stack itself: inference-server and framework vulnerabilities, unsafe deserialisation in model formats, model and training-data extraction",
]

