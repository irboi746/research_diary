name: Validate generated content

# The pipeline's input is untrusted web content and its author is an agent with
# write access. This workflow runs on the pull request Jules opens and gives fast
# feedback on it.
#
# It is NOT the trust boundary, and must not be treated as one. For a same-repo
# branch, `on: pull_request` runs the copy of this file from the PR head, along
# with the PR's copy of pathguard.py -- so a pull request supplies both the rules
# and the code that checks them, and can make this workflow say whatever it likes.
#
# The decision to merge therefore lives in auto-merge.yml, which `on: workflow_run`
# always runs from the default branch, and which re-runs the guard from main
# against this PR's diff. A green tick here means nothing on its own.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.166.0
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb, from the
  # release's own hugo_${HUGO_VERSION}_checksums.txt. Bump both together.
  HUGO_SHA256: 52b06555f739b1a08e04f5c31296e9bdf166a012e9b7e3137befc889dbc24db8

jobs:
  validate:
    runs-on: ubuntu-latest
    # Branch names may contain $, backticks and semicolons, so github.base_ref
    # goes through env rather than being pasted into a run: body. It is pinned to
    # main by the branches: filter today; this keeps it safe if that widens.
    env:
      BASE_REF: ${{ github.base_ref }}
    outputs:
      clean: ${{ steps.verdict.outputs.clean }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Advisory only -- this is the PR's own copy of the guard. auto-merge.yml
      # re-runs it from main, and that is the run that decides anything.
      - name: Path allowlist
        run: |
          python3 automation/scripts/pathguard.py --base "origin/$BASE_REF"

      # No pip install here, deliberately. These run stdlib-only so the merge
      # path never puts a third-party package between an untrusted pull request
      # and a write token; test_fulltext.py skips its library-backed half rather
      # than failing. See requirements.txt.
      - name: Script self-tests
        run: |
          python3 automation/scripts/test_idstate.py
          python3 automation/scripts/test_pathguard.py
          python3 automation/scripts/test_postparse.py
          python3 automation/scripts/test_validate.py
          python3 automation/scripts/test_arxiv.py
          python3 automation/scripts/test_rank.py
          python3 automation/scripts/test_queue.py
          python3 automation/scripts/test_fulltext.py

      - name: Content schema
        run: python3 automation/scripts/validate.py

      # Advisory here on purpose. This workflow runs the pull request's own copy
      # of everything, so a green tick is not evidence; auto-merge.yml runs the
      # gating copy from main. This exists so a dead link shows on the PR without
      # waiting for the merge gate to reject it.
      - name: Resolve what the post cites (advisory)
        continue-on-error: true
        run: |
          python3 automation/scripts/linkcheck.py --changed --base "origin/$BASE_REF"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Install Hugo extended
        run: |
          set -euo pipefail
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Fetch theme
        run: hugo mod get -u github.com/adityatelange/hugo-PaperMod

      # validate.py rejects future and non-UTC dates, but only a real build
      # proves the page survives Hugo. buildFuture=false drops such pages
      # silently, so "it built" is not the same as "the page exists".
      - name: Build and assert the new pages exist
        run: |
          hugo --minify --baseURL "https://irboi746.github.io/research_diary/" -d ./public

          missing=0
          # NUL-delimited: an unquoted $(...) in a for loop word-splits and glob-
          # expands, so a filename with a space became two bogus iterations.
          while IFS= read -r -d '' f; do
            [ "$(basename "$f")" = "_index.md" ] && continue
            [ -f "$f" ] || continue

            # Honour an explicit slug; otherwise Hugo uses the filename.
            slug=$(sed -n 's/^slug *= *"\(.*\)"/\1/p' "$f" | head -1)
            [ -n "$slug" ] || slug=$(basename "$f" .md)
            section=$(echo "$f" | cut -d/ -f2)

            if [ -f "public/$section/$slug/index.html" ]; then
              echo "ok      $f -> /$section/$slug/"
            else
              echo "MISSING $f -> expected public/$section/$slug/index.html"
              missing=$((missing + 1))
            fi
          done < <(git diff --name-only -z "origin/$BASE_REF...HEAD" \
                     -- 'content/arxiv/*.md' 'content/conferences/*.md' 'content/deep-dives/*.md')

          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing page(s) did not render. The usual cause is a date Hugo"
            echo "considers to be in the future, which buildFuture=false drops silently."
            exit 1
          fi

      - name: Warn on Hugo diagnostics
        run: |
          hugo --minify --baseURL "https://irboi746.github.io/research_diary/" -d ./public2 2>&1 \
            | tee build.log
          if grep -Eiq '^(WARN|ERROR)' build.log; then
            echo "Hugo reported warnings or errors:"
            grep -Ei '^(WARN|ERROR)' build.log
            exit 1
          fi

      - id: verdict
        run: echo "clean=true" >> "$GITHUB_OUTPUT"

# The merge job that used to live here has moved to auto-merge.yml. It cannot run
# from this file: everything here is supplied by the pull request being judged.
