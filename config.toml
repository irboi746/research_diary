#
# Theme setup
#
# If you use go mod to install your theme, you must use the URL of the theme.
# If your theme is in the themes directory, you just need to specify its name.
#
baseURL = "/"
title = "research_diary"
theme = ["github.com/adityatelange/hugo-PaperMod"]

# These must stay ABOVE the first [table] header. TOML scopes every key after a
# header into that table, so when they sat below [pagination] Hugo never saw
# them -- including buildFuture, which the content pipeline depends on.
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[pagination]
pagerSize = 5

[minify]
disableXML = true

[languages.en]
label = "English"
weight = 1

[languages.en.taxonomies]
category = "categories"
tag = "tags"
series = "series"

[[languages.en.menu.main]]
name = "News"
url = "news/"
weight = 1
[[languages.en.menu.main]]
name = "Research"
url = "research/"
weight = 2
[[languages.en.menu.main]]
name = "About"
url = "about/"
weight = 3

[outputs]
home = ["HTML", "RSS"]

[params]
env = "production"
# Which sections appear in the homepage list. PaperMod reads this from params.
mainSections = ["news", "research"]
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true

[params.homeInfoParams]
Title = "research_diary"
Content = "A technical research diary: daily briefs on new security and CS work, plus long-form deep dives."

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true
[services.x]
disableInlineCSS = true
